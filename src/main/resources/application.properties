# Application
spring.application.name=event-ticket-booking

# PostgreSQL: host port 5433 maps to container port 5432 in docker-compose.yaml.
spring.datasource.url=jdbc:postgresql://localhost:5433/eventticketdb
spring.datasource.username=postgres
spring.datasource.password=welcome
spring.datasource.driver-class-name=org.postgresql.Driver

# Liquibase owns schema changes. Hibernate validates but never creates/updates tables.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when_authorized

# Do not leak stack traces or internal exception messages in HTTP responses.
server.error.include-message=never
server.error.include-stacktrace=never


